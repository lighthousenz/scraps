#:schema https://mise.jdx.dev/schema/mise.json
# `mise bootstrap` and `mise doctor project` both need 2026.10.20.
min_version = "2026.10.20"

# scraps — see README.md and AGENTS.md
#   mise bootstrap        install the pinned toolchain; repeat-safe
#   mise doctor project   check this machine is ready; inspects only

[tools]
cocogitto = "7.0.0"
go = "1.27.3"
golangci-lint = "2.15.0"
goreleaser = "2.19.0"
lefthook = "2.2.2"
rumdl = "0.3.2"
yamlfmt = "0.21.0"

[bootstrap.hooks.post-tools]
run = """
mise exec -- go version
mise exec -- lefthook install
"""

# mise discards check output and shows only the hint, so each check tests one thing.

[doctor.checks.git]
description = "git is installed"
run = "git --version"
hint = "Install git (macOS: xcode-select --install)."

[doctor.checks.cocogitto]
description = "cocogitto is installed"
run = "cog --version"
hint = "Run `mise bootstrap`."

[doctor.checks.go]
description = "Go is installed at the version mise.toml pins"
run = 'test "$(go env GOVERSION)" = "go$(mise current go)"'
hint = "Run `mise bootstrap`."

[doctor.checks.golangci-lint]
description = "golangci-lint is installed"
run = "golangci-lint version"
hint = "Run `mise bootstrap`."

[doctor.checks.goreleaser]
description = "goreleaser is installed"
run = "goreleaser --version"
hint = "Run `mise bootstrap`."

[doctor.checks.lefthook]
description = "lefthook is installed"
run = "lefthook version"
hint = "Run `mise bootstrap`."

[doctor.checks.lefthook-hooks]
description = "lefthook hooks are installed in this clone"
run = "lefthook check-install"
hint = "Run `mise bootstrap`."

[doctor.checks.rumdl]
description = "rumdl is installed"
run = "rumdl --version"
hint = "Run `mise bootstrap`."

[doctor.checks.yamlfmt]
description = "yamlfmt is installed"
run = "yamlfmt -version"
hint = "Run `mise bootstrap`."

[doctor.checks.gh]
description = "GitHub CLI is installed (needed by rulesets:apply)"
run = "gh --version"
hint = "Install gh: https://cli.github.com/"

[doctor.checks.jq]
description = "jq is installed (needed by rulesets:apply)"
run = "jq --version"
hint = "Install jq: brew install jq / apt install jq"

# Build tasks — see AGENTS.md "Build and test".

[tasks.build]
description = "Build the scraps binary into dist/"
run = """
mkdir -p dist
go build -ldflags "-X main.version=$(git describe --tags --always --dirty)" -o dist/scraps ./cmd/scraps
"""

[tasks.test]
description = "Run tests with race detector"
usage = 'arg "[args]" var=#true double_dash="automatic"'
run = "go test -race ${usage_args:-./...}"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.fmt]
description = "Format Go, Markdown, YAML and mise.toml"
run = """
golangci-lint fmt
rumdl fmt AGENTS.md README.md testdata/e2e/README.md
yamlfmt .github/workflows/*.yml .goreleaser.yaml .golangci.yml $(git ls-files 'examples/**/*.yaml')
mise fmt
"""

[tasks."fmt:check"]
description = "Check formatting without writing (Go, Markdown, YAML, mise.toml)"
run = """
golangci-lint fmt --diff && \
rumdl fmt --check AGENTS.md README.md testdata/e2e/README.md && \
yamlfmt -lint .github/workflows/*.yml .goreleaser.yaml .golangci.yml $(git ls-files 'examples/**/*.yaml') && \
mise fmt --check
"""

[tasks."lint:md"]
description = "Lint Markdown files with rumdl"
run = "rumdl check AGENTS.md README.md internal/report/testdata/report.md testdata/e2e/README.md"

[tasks.check]
description = "The gate: fmt check, lint, build, test"
run = """
mise run fmt:check && \
mise run lint:md && \
golangci-lint run && \
mise run build && \
mise run test
"""

[tasks."test:e2e"]
description = "Build and run end-to-end acceptance tests"
run = "mise run build && go test -tags e2e -count=1 -timeout 30m ./e2e/..."

[tasks."release:check"]
description = "Validate goreleaser config and run a snapshot build"
run = "goreleaser check && goreleaser release --snapshot --clean"

[tasks."lint:commits"]
description = "Check conventional commits since the latest v* tag"
run = """
tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null) || { echo "No v* tag found; skipping."; exit 0; }
if [ "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)" ]; then
  echo "HEAD is the tagged commit $tag; nothing to check."
  exit 0
fi
cog check "$tag..HEAD"
"""

[tasks."rulesets:apply"]
description = "Apply .github/rulesets/*.json to the repo via gh api (dry-run by default)"
usage = '''
flag "--apply" help="Actually create/update/delete rulesets (default is dry-run)"
flag "--prune" help="Delete remote rulesets that have no local JSON file"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail

REPO="$(gh repo view --json nameWithOwner -q .nameWithOwner)"
RULESETS_DIR=".github/rulesets"

if [ ! -d "$RULESETS_DIR" ]; then
  echo "No $RULESETS_DIR directory found." >&2
  exit 1
fi

apply="${usage_apply:-false}"
prune="${usage_prune:-false}"

# Collect local ruleset files
local_files=()
for f in "$RULESETS_DIR"/*.json; do
  [ -f "$f" ] || continue
  local_files+=("$f")
done

if [ "${#local_files[@]}" -eq 0 ]; then
  echo "No JSON files in $RULESETS_DIR." >&2
  exit 1
fi

# Fetch existing remote rulesets as JSON array
remote_json="$(gh api "repos/$REPO/rulesets?includes_parents=false" --paginate)"

# Lookup remote ruleset id by name; prints id or empty
remote_id_for() {
  echo "$remote_json" | jq -r --arg n "$1" '.[] | select(.name == $n) | .id // empty'
}

echo "=== Ruleset sync plan for $REPO ==="
echo ""

# Track which remote names have a local file
local_names=""
for f in "${local_files[@]}"; do
  name="$(jq -r '.name' "$f")"
  local_names="$local_names|$name|"
  rid="$(remote_id_for "$name")"
  if [ -n "$rid" ]; then
    echo "UPDATE  \"$name\" (id $rid) <- $f"
    if [ "$apply" = "true" ]; then
      gh api "repos/$REPO/rulesets/$rid" \
        --method PUT \
        --input "$f" \
        --silent
      echo "  done"
    fi
  else
    echo "CREATE  \"$name\" <- $f"
    if [ "$apply" = "true" ]; then
      gh api "repos/$REPO/rulesets" \
        --method POST \
        --input "$f" \
        --silent
      echo "  done"
    fi
  fi
done

# Report orphan rulesets (remote but no local file)
echo ""
orphan_count=0
while IFS=$'\t' read -r rid rname; do
  [ -n "$rid" ] || continue
  case "$local_names" in
    *"|$rname|"*) continue ;;
  esac
  if [ "$orphan_count" -eq 0 ]; then
    echo "=== Orphan rulesets (remote but no local file) ==="
  fi
  orphan_count=$((orphan_count + 1))
  echo "ORPHAN  \"$rname\" (id $rid)"
  if [ "$prune" = "true" ]; then
    if [ "$apply" = "true" ]; then
      gh api "repos/$REPO/rulesets/$rid" --method DELETE --silent
      echo "  deleted"
    else
      echo "  (would delete with --apply)"
    fi
  fi
done <<EOF
$(echo "$remote_json" | jq -r '.[] | [(.id | tostring), .name] | @tsv')
EOF

if [ "$orphan_count" -gt 0 ] && [ "$prune" != "true" ]; then
  echo ""
  echo "Pass --prune to mark these for deletion (still needs --apply to execute)."
fi
if [ "$orphan_count" -eq 0 ]; then
  echo "No orphan rulesets."
fi

if [ "$apply" != "true" ]; then
  echo ""
  echo "Dry run complete. Pass --apply to execute changes."
fi{% endraw %}
'''
