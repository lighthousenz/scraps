#:schema https://mise.jdx.dev/schema/mise.json
# `mise bootstrap` and `mise doctor project` both need 2026.10.20.
min_version = "2026.10.20"

# scraps — see README.md and AGENTS.md
#   mise bootstrap        install the pinned toolchain; repeat-safe
#   mise doctor project   check this machine is ready; inspects only

[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
goreleaser = "2.19.0"
rumdl = "0.3.2"
yamlfmt = "0.21.0"

[bootstrap.hooks.post-tools]
run = "mise exec -- go version"

# mise discards check output and shows only the hint, so each check tests one thing.

[doctor.checks.git]
description = "git is installed"
run = "git --version"
hint = "Install git (macOS: xcode-select --install)."

[doctor.checks.go]
description = "Go is installed at the version mise.toml pins"
run = 'test "$(go env GOVERSION)" = "go$(mise current go)"'
hint = "Run `mise bootstrap`."

[doctor.checks.golangci-lint]
description = "golangci-lint is installed"
run = "golangci-lint version"
hint = "Run `mise bootstrap`."

[doctor.checks.goreleaser]
description = "goreleaser is installed"
run = "goreleaser --version"
hint = "Run `mise bootstrap`."

[doctor.checks.rumdl]
description = "rumdl is installed"
run = "rumdl --version"
hint = "Run `mise bootstrap`."

[doctor.checks.yamlfmt]
description = "yamlfmt is installed"
run = "yamlfmt -version"
hint = "Run `mise bootstrap`."

# Build tasks — see AGENTS.md "Build and test".

[tasks.build]
description = "Build the scraps binary into dist/"
run = """
mkdir -p dist
go build -ldflags "-X main.version=$(git describe --tags --always --dirty)" -o dist/scraps ./cmd/scraps
"""

[tasks.test]
description = "Run tests with race detector"
usage = 'arg "[args]" var=#true double_dash="automatic"'
run = "go test -race ${usage_args:-./...}"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.fmt]
description = "Format Go, Markdown, YAML and mise.toml"
run = """
golangci-lint fmt
rumdl fmt AGENTS.md README.md internal/report/testdata/report.md testdata/e2e/README.md
yamlfmt .github/workflows/*.yml .goreleaser.yaml .golangci.yml examples/**/*.yaml
mise fmt
"""

[tasks."fmt:check"]
description = "Check formatting without writing (Go, Markdown, YAML, mise.toml)"
run = """
golangci-lint fmt --diff && \
rumdl fmt --check AGENTS.md README.md internal/report/testdata/report.md testdata/e2e/README.md && \
yamlfmt -lint .github/workflows/*.yml .goreleaser.yaml .golangci.yml examples/**/*.yaml && \
mise fmt --check
"""

[tasks."lint:md"]
description = "Lint Markdown files with rumdl"
run = "rumdl check AGENTS.md README.md internal/report/testdata/report.md testdata/e2e/README.md"

[tasks.check]
description = "The gate: fmt check, lint, build, test"
run = """
mise run fmt:check && \
mise run lint:md && \
golangci-lint run && \
mise run build && \
mise run test
"""

[tasks."test:e2e"]
description = "Build and run end-to-end acceptance tests"
run = "mise run build && go test -tags e2e -count=1 -timeout 30m ./e2e/..."

[tasks."release:check"]
description = "Validate goreleaser config and run a snapshot build"
run = "goreleaser check && goreleaser release --snapshot --clean"
