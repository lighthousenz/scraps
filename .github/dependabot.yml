version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      gomod:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /examples/actors/collab-server
      - /examples/actors/editor
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    groups:
      example-actors:
        patterns: ["*"]
