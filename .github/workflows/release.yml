name: release

on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml
      - mise.toml
      - go.mod
      - go.sum
      - "**/*.go"
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: "2026.10.20"
      - run: mise run release:check

  release-manual:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: "2026.10.20"
      - run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-auto:
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: "2026.10.20"

      - name: Skip if HEAD is already tagged
        id: check-tag
        run: |-
          if git describe --exact-match --tags --match 'v*' HEAD >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "HEAD is already tagged $(git describe --exact-match --tags --match 'v*' HEAD); nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next version
        if: steps.check-tag.outputs.skip != 'true'
        id: next-version
        run: |-
          output=$(cog bump --auto --dry-run 2>&1) || {
            echo "::error::cog bump failed: $output"
            exit 1
          }
          if echo "$output" | grep -q "No conventional commits for your repository that required a bump"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No release-worthy commits since the last tag." >> "$GITHUB_STEP_SUMMARY"
            echo "cog output: $output" >> "$GITHUB_STEP_SUMMARY"
          else
            version=$(echo "$output" | tail -1)
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Next version: $version"
          fi

      - name: Tag and release
        if: steps.check-tag.outputs.skip != 'true' && steps.next-version.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ steps.next-version.outputs.version }}
        run: |-
          git tag -a "$NEXT_VERSION" -m "$NEXT_VERSION" HEAD
          git push origin "$NEXT_VERSION"
          goreleaser release --clean
