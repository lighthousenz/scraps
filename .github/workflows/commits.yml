name: commits
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.10.20"
      - name: Check conventional commits
        run: |-
          echo "Checking commits in ${PR_BASE_SHA}..${PR_HEAD_SHA}"
          if ! cog check "${PR_BASE_SHA}..${PR_HEAD_SHA}"; then
            echo ""
            echo "::error::Some commits do not follow the conventional commit format."
            echo ""
            echo "A valid subject looks like:"
            echo "  <type>(<optional scope>): <description>"
            echo ""
            echo "Allowed types: feat fix docs style refactor perf test build ci chore revert retro"
            exit 1
          fi
