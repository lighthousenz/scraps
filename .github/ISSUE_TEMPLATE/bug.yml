name: Bug report
description: Scraps did something it should not, or the README and the code disagree.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >-
        The smallest scraps.yaml, scenario and actor that reproduce it. Use synthetic data only.
      render: yaml
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `scraps --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [linux, macOS]
    validations:
      required: true
